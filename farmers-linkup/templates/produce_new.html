{% extends "app_base.html" %}
{% block title %}List Produce · Farmer's LinkUp{% endblock %}
{% block content %}
<a href="{{ url_for('produce') }}" class="text-decoration-none small"><i class="bi bi-arrow-left"></i> Back</a>
<h3 class="mt-2">List New Produce</h3>
<p class="text-muted">Verified buyers across the Southeast will see this right away.</p>

<form method="post" class="card-lite p-3 p-md-4">
  <div class="mb-3"><label class="form-label">Crop</label>
    <select class="form-select" name="crop" required>
      {% for c in crops %}<option>{{ c }}</option>{% endfor %}
    </select></div>

  <div class="mb-3"><label class="form-label d-block">Grade</label>
    <div class="btn-group w-100" role="group">
      <input type="radio" class="btn-check" name="grade" id="gA" value="A" checked>
      <label class="btn btn-outline-slate" for="gA">Grade A · Fresh table pick</label>
      <input type="radio" class="btn-check" name="grade" id="gB" value="B">
      <label class="btn btn-outline-slate" for="gB">Grade B · Processing</label>
    </div></div>

  <div class="row g-3 mb-3">
    <div class="col-6"><label class="form-label">Quantity (kg)</label>
      <input id="qty" class="form-control" type="number" name="qty" min="50" placeholder="500" required></div>
    <div class="col-6"><label class="form-label">Price per kg (₦)</label>
      <input id="price" class="form-control" type="number" name="price" min="1" placeholder="250" required></div>
  </div>
  <div class="card-lite p-3 mb-3" style="background:var(--green-soft)">
    <span class="small text-muted">Estimated lot value</span>
    <div class="stat-num text-success" id="estimate">₦0</div>
  </div>

  <div class="mb-3"><label class="form-label">Pickup location</label>
    <select class="form-select" name="location" required>
      {% for l in locations %}<option>{{ l }}</option>{% endfor %}
    </select></div>

  <div class="mb-4"><label class="form-label">Available for pickup for</label>
    <select class="form-select" name="hours">
      <option value="24">24 hours</option><option value="48" selected>48 hours</option><option value="72">72 hours</option>
    </select></div>

  <button class="btn btn-primary w-100">Publish Listing</button>
</form>
{% endblock %}
